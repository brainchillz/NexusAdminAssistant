name: tests

# Runs on every push and PR. docker-publish.yml waits on this workflow, so a
# red suite never reaches :latest — it previously built and pushed the image
# without running the tests at all.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # docker-publish.yml calls this so a release cannot be built without the suite
  # passing first, in the same run rather than by hoping two workflows interleave.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # Style is advisory (the codebase predates the config); the error rules
      # in pyproject.toml are the ones that catch real bugs, so those gate.
      - name: Lint
        run: ruff check .
